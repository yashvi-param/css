<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>height and width</title>
    <style>
      div {
        height: 70px;
        width: 100%;
        border: 1px solid #4caf50;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <!-- The CSS height and width properties are used to set the height and width of
    an element. The height and width do not include padding, borders, or
    margins. It sets the height and width of the area inside the padding,
    border, and margin of the element. -->

    <h2>CSS height and width properties</h2>

    <div>This div element has a height of 70 pixels and a width of 100%.</div>
  </body>
</html>

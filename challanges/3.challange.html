<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css colors</title>
    <style>
      h1 {
        color: tomato;
      }

      h2 {
        color: #1e90ff;
      }

      p {
        color: rgb(60, 179, 113);
      }
    </style>
  </head>

    <h1>Color Name</h1>
    <h2>Hex Value</h2>
    <p>RGB Value</p>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>border color</title>
    <style>
      p.one {
        border-style: solid;
        border-color: red;
      }
      p.two {
        border-style: solid;
        border-color: green;
      }
      p.three {
        border-style: dotted;
        border-color: blue;
      }
    </style>
  </head>
  <body>
    <h2>The border color property</h2>
    <p>This property specifies the color of the four borders:</p>

    <p class="one">A solid red color</p>
    <p class="two">A solid green color</p>
    <p class="three">A dotted blue color</p>

    <p>
      <b>Note:</b> The "border-color" property does not work if it is used
      alone. Use the "border-style" property to set the borders first.
    </p>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiple style sheet</title>

    <style>
      h1 {
        color: orange;
      }
    </style>
    <link rel="stylesheet" type="text/css" href="4.mystyle.css" />
  </head>
  <body>
    <!-- If the internal style is defined after the link to the external style sheet, the <h1> elements will be "orange": -->

    <h1>This is a heading</h1>
    <p>
      The style of this document is a combination of an external stylesheet, and
      internal style
    </p>
  </body>
</html>

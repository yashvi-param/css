<!-- CSS Margins
The CSS margin properties are used to create space around elements,
outside of any defined borders. Margins define the distance between an element's
border and the surrounding elements. With CSS, you have full control over the
margins. CSS has properties for setting the margin for each individual side of
an element (top, right, bottom, and left), and a shorthand property for setting
all the margin properties in one declaration. -->

<!doctype html>

    <title>

      inherit Value
    </title>

      /* The auto Value
            You can set the margin property to auto to horizontally center the element within its container.

            The element will then take up the specified width, and the remaining space will be split equally between the left and right margins. */

      /* div {
              width: 300px;
              margin: auto;
              border: 1px solid red;
            } */

      /* The inherit Value
      You can set the margin property to inherit to let the margin be inherited from the parent element. */

      div {
        border: 1px solid red;
        margin-left: 100px;
      }

      p.ex1 {
        margin-left: inherit;
      }
    </style>

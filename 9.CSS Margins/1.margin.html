<!-- CSS Margins
The CSS margin properties are used to create space around elements,
outside of any defined borders. Margins define the distance between an element's
border and the surrounding elements. With CSS, you have full control over the
margins. CSS has properties for setting the margin for each individual side of
an element (top, right, bottom, and left), and a shorthand property for setting
all the margin properties in one declaration. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      margin, Margin - Individual Sides, Margin - Shorthand Property
    </title>
    <style>
      /* div{
            margin: 70px;
            border:1px solid #4CAF50;
        } */

      /* div {
        border: 1px solid black;
        margin-top: 100px;
        margin-bottom: 100px;
        margin-right: 150px;
        margin-left: 80px;
        background-color: lightblue;
      } */

      div {
        border: 1px solid black;
        margin: 25px 50px 75px 100px;
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <!-- <h2>CSS Margins</h2>
    <div>This element has a margin of 70px.</div> -->

    <!-- <h2>Using individual margin properties</h2>
    <div>
      This div element has a top margin of 100px, a right margin of 150px, a
      bottom margin of 100px, and a left margin of 80px.
    </div> -->

    <h2>The margin shorthand property - 4 values</h2>

    <div>
      This div element has a top margin of 25px, a right margin of 50px, a
      bottom margin of 75px, and a left margin of 100px.
    </div>

    <hr />
  </body>
</html>

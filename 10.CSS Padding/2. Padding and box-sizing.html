<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>padding, Padding and element width - with box-sizing</title>

    <!-- Padding and Element Width 
    The CSS width property specifies the width of the
    element's content area. The content area is the portion inside the padding,
    border, and margin of an element (the box model). So, if an element has a
    specified width, the padding added to that element will be added to the
    total width of the element. This is often an undesirable result. -->
    <!-- 
    Padding and box-sizing 
    The box-sizing property defines how the width and
    height of an element are calculated: should they include padding and
    borders, or not. The box-sizing property can have the following values:
    content-box - This is default. The width and height properties includes only
    the content (border and padding are not included) border-box - The width and
    height properties includes content, padding and border So, to keep the width
    at 300px, no matter the amount of padding, you can use the box-sizing:
    border-box;. This causes the element to maintain its actual width; if you
    increase the padding, the available content space will decrease. -->

    <style>
      /* div.ex1 {
        width: 300px;
        background-color: yellow;
      }

      div.ex2 {
        width: 300px;
        padding: 25px;
        background-color: lightblue;
      } */

      div.ex1 {
        width: 300px;
        background-color: yellow;
      }

      div.ex2 {
        width: 300px;
        padding: 25px;
        box-sizing: border-box;
        background-color: lightblue;
      }
    </style>
  </head>
  <body>
    <!-- <h2>Padding and element width</h2> -->

    <!-- <div class="ex1">This div is 300px wide.</div>
    <br />

    <div class="ex2">
      The width of this div is 350px, even though it is defined as 300px in the
      CSS.
    </div> -->

    <h2>Padding and element width - with box-sizing</h2>

    <div class="ex1">This div is 300px wide.</div>
    <br />

    <div class="ex2">
      The width of this div remains at 300px, in spite of the 50px of total left
      and right padding, because of the box-sizing: border-box property.
    </div>
  </body>
</html>

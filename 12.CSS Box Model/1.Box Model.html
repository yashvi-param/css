  <body>
    <!-- The CSS Box Model 
    In CSS, the term "box model" is used when talking about
    web design and layout. The CSS box model is essentially a box that wraps
    around every HTML element. Every box consists of four parts: content,
    padding, borders and margins. -->

    <!-- 
    Content - The content of the box, where text and images appear
    Padding - Clears an area around the content. The padding is transparent
    Border - A border that goes around the padding and content
    Margin - Clears an area outside the border. The margin is transparent -->

    In order to set the width and height of an
